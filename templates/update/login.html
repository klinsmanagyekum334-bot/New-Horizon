<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — {{ site.brand_name if site else "New Horizon Coopers Limited" }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Changed to update.css -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/update.css') }}">
</head>
<body class="login-body">

  <div class="login-card">

    <div class="login-icon">
      <i class="fa-solid fa-house-chimney"></i>
    </div>

    <h1>Admin Panel</h1>
    <p class="login-sub">
      {{ site.brand_name if site else "New Horizon Coopers Limited" }}
    </p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="login-flash login-flash-{{ cat }}">
          <i class="fa-solid {% if cat == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %}"></i>
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <!-- Changed to update_login -->
    <form method="POST" action="{{ url_for('update_login') }}">
      <input type="password"
             name="password"
             placeholder="Enter admin password"
             required
             autofocus
             autocomplete="current-password">
      <button type="submit" class="login-btn">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to site
    </a>

  </div>

</body>
</html>
